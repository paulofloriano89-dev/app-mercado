<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #333; font-size: 1.5rem; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { display: none; }
        .btn { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 10px 0; width: 100%; display: inline-block; font-weight: bold; text-decoration: none; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; padding: 6px 12px; font-size: 0.85rem; width: auto; }
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        .thumb-container { position: relative; display: inline-block; }
        .thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 2px solid #ddd; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }
        #result { margin-top: 20px; text-align: left; background: #e9ecef; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Comparar Preços</h1>
        
        <!-- Input com capture="environment" para abrir a câmara e multiple para permitir várias fotos seguidas -->
        <label for="cameraInput" class="btn">📸 Tirar / Adicionar Fotos</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple>

        <div class="gallery" id="gallery"></div>

        <button class="btn btn-success" id="compareBtn" style="display:none;" onclick="compararPrecos()">⚡ Comparar Preços</button>
        <button class="btn btn-danger" id="clearBtn" style="display:none;" onclick="limparFotos()">Limpar fotos</button>

        <div id="result" style="display:none;"></div>
    </div>

    <script>
        let imagensBase64 = [];

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files) return;

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagensBase64.push(e.target.result);
                    atualizarGaleria();
                };
                reader.readAsDataURL(file);
            }
            // Reseta o input para permitir selecionar novas fotos logo em seguida
            this.value = '';
        });

        function atualizarGaleria() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            imagensBase64.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.className = 'thumb-container';
                div.innerHTML = `
                    <img src="${imgSrc}" class="thumb">
                    <button class="remove-btn" onclick="removerFoto(${index})">×</button>
                `;
                gallery.appendChild(div);
            });

            const compareBtn = document.getElementById('compareBtn');
            const clearBtn = document.getElementById('clearBtn');
            if (imagensBase64.length > 0) {
                compareBtn.style.display = 'block';
                clearBtn.style.display = 'inline-block';
            } else {
                compareBtn.style.display = 'none';
                clearBtn.style.display = 'none';
            }
        }

        function removerFoto(index) {
            imagensBase64.splice(index, 1);
            atualizarGaleria();
        }

        function limparFotos() {
            imagensBase64 = [];
            atualizarGaleria();
            document.getElementById('result').style.display = 'none';
        }

        async function compararPrecos() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerText = '⚡ Analisando etiquetas com IA...';

            try {
                const response = await fetch('/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images: imagensBase64 })
                });

                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerText = data.analysis;
                } else {
                    resultDiv.innerText = 'Erro: ' + (data.error || 'Erro desconhecido no servidor.');
                }
            } catch (err) {
                resultDiv.innerText = 'Erro de conexão com o servidor.';
            }
        }
    </script>
</body>
</html>
